<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="120" r="200" fill="#3b82f6" fill-opacity="0.15"/>
  <circle cx="150" cy="530" r="150" fill="#3b82f6" fill-opacity="0.10"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="6" height="120" rx="3" fill="#3b82f6"/>

  <!-- Main headline -->
  <text x="112" y="250" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-2">Consulente Informatico</text>
  <text x="112" y="328" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#3b82f6" letter-spacing="-2">a Caserta</text>

  <!-- Subtitle -->
  <text x="114" y="390" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">Siti web professionali · Supporto IT · Preventivo gratuito</text>

  <!-- Bottom name + domain -->
  <text x="114" y="540" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Domenico Tavoletta</text>
  <text x="114" y="576" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">domenicotavoletta.it</text>

  <!-- Logo badge top right -->
  <rect x="1060" y="36" width="100" height="100" rx="20" fill="#3b82f6"/>
  <text x="1110" y="103" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">DT</text>
</svg>
